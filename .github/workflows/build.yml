name: Build DNS optimized

on:
  push:
    branches: [main]
    tags: ["v*-dns-optimized-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release for this main-branch commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build after a tested upstream merge
        type: string
        default: ""
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dns-build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  SKIP_INTEROP_TEST: "1"
  SKIP_CONCURRENT_TEST: "1"

jobs:
  check:
    name: DNS routing tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd
      - name: Read the checked release matrix
        id: matrix
        run: printf 'matrix=%s\n' "$(python3 scripts/release-build.py matrix)" >> "$GITHUB_OUTPUT"
      - name: Test fork changes and sync safeguards
        run: bash scripts/ci-check.sh test
      - name: Identify the exact build
        id: version
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          upstream=$(cat UPSTREAM_VERSION)
          [[ "$upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          base=$(cat DNS_RELEASE_BASE)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$base" HEAD
          revision=$(git rev-list --first-parent --count "$base"..HEAD)
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          version="${upstream}-dns-optimized-${revision}"
          release_tag="$version"
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            [[ "$EVENT_REF_NAME" == "$release_tag" ]] || { echo 'Tag does not match this numeric revision' >&2; exit 1; }
          fi
          {
            printf 'commit=%s\n' "$commit"
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'build_time=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection tools
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd
      - name: Install pinned Android NDK
        if: matrix.android
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is missing}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$sdk" >> "$GITHUB_ENV"
      - name: Build, package and inspect the complete core with gVisor
        env:
          TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          BUILD_TIME: ${{ needs.check.outputs.build_time }}
        run: bash scripts/ci-check.sh build "$TARGET" "$RUNNER_TEMP/dist" "$BUILD_VERSION" "$BUILD_TIME"
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mihomo-dns-${{ matrix.target }}-${{ needs.check.outputs.commit }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  updater-platforms:
    name: Core updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Verify native core replacement, rollback and macOS signing
        run: go test -tags with_gvisor -count=1 -timeout=5m ./component/updater

  release:
    name: Publish GitHub release
    needs: [check, build, updater-platforms]
    if: >-
      github.repository == 'chummumm/mihomo-dns-optimized' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dns-optimized-')) ||
       (inputs.publish_release && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: dns-release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Download all release targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mihomo-dns-*-${{ needs.check.outputs.commit }}
          path: dist
          merge-multiple: true
      - name: Publish immutable commit build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.check.outputs.commit }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/release-build.py collect dist "$BUILD_VERSION" "$BUILD_SHA"
          cd dist
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          assets=( ./*.gz ./*.zip ./*.deb ./*.rpm ./*.pkg.tar.zst BUILDINFO.json SHA256SUMS version.txt )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists; checking its immutable assets.\n' "$RELEASE_TAG"
          else
            {
              printf 'Mihomo DNS optimized `%s`\n\n' "$BUILD_VERSION"
              printf 'Source commit: `%s`\n\n' "$BUILD_SHA"
              printf '37 platform/CPU targets: Linux, Windows, macOS, FreeBSD and Android. Linux deb/rpm and selected Arch packages are included.\n\n'
              printf 'Built with the upstream MetaCubeX Go 1.26 toolchain and with_gvisor; Android uses pinned NDK r29/API34 with CGO, other builds use CGO=0.\n\n'
              printf 'Linux amd64 is GOAMD64=v1; v2/v3 are separate downloads. This release does not include old-Go or LoongArch ABI1 variants.\n\n'
              printf 'Choose a matching target and verify SHA256SUMS. Installation packages preserve /etc/mihomo/config.yaml and never start or enable services automatically.\n\n'
              printf 'Matrix, installation and compatibility: https://github.com/%s/blob/%s/docs/releases.md\n\n' "$GITHUB_REPOSITORY" "$BUILD_SHA"
              printf 'Enable top-level `dns-rule-routing: true` for forwarded TCP/UDP DNS on port 53. Native DNS supports configured UDP/TCP upstream ports, DoT, DoH including HTTP/3, and DoQ; DIRECT uses `direct-nameserver`, proxy routes use `nameserver`, with the selected outbound retained.\n'
              printf 'Optional DIRECT IP speed checks and dual-stack selection, bounded cache prefetch/stale answers, TTL bounds and safe CNAME flattening are configured under `dns:`. These optional optimizations default to off; see the migration, DNSSEC protection and scope notes.\n'
              printf 'DNS correctness fixes preserve upstream/fallback identity, EDNS fields, elapsed TTL and address-family policy. Probe saturation skips measurement immediately; normal DNS requests keep their own deadline.\n'
              printf 'The core updater uses this repository, pins the selected version and verifies SHA256SUMS before replacement. Use the release/auto channel; the official alpha channel is not used.\n'
              printf 'No production metrics endpoint or telemetry was added. Controlled load and regression tests run in CI; see docs/dns-performance.md.\n'
            } > "$RUNNER_TEMP/release-notes.txt"
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "$BUILD_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" \
              --latest=false \
              "${assets[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          python3 ../scripts/release-build.py verify-published . "$RUNNER_TEMP/published-release.json"
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BUILD_SHA" == "$current_main" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            printf 'Build %s is not current main (%s); Latest is unchanged.\n' "$BUILD_SHA" "$current_main"
          fi
