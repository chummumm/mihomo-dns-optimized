name: Build mihomo-optimized

on:
  push:
    branches: [main]
    tags: ["mihomo-optimized-v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "Meta.png"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.markdown"
      - "**/*.rst"
      - "**/*.adoc"
      - "docs/**"
      - "Meta.png"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a release for this main-branch commit
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build after a tested upstream merge
        type: string
        default: ""
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: optimized-build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  SKIP_INTEROP_TEST: "1"
  SKIP_CONCURRENT_TEST: "1"

jobs:
  check:
    name: Core, DNS and release tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Identify the exact build
        id: version
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          is_uint64() {
            [[ "$1" =~ ^(0|[1-9][0-9]*)$ ]] &&
              { (( ${#1} < 20 )) || { (( ${#1} == 20 )) && [[ "$1" < 18446744073709551615 || "$1" == 18446744073709551615 ]]; }; }
          }
          verify_release_tag() {
            local tag=$1 expected=$2 allow_missing=$3 refs status sha ref extra object= peeled=
            if refs=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              while IFS=$'\t' read -r sha ref extra; do
                [[ "$sha" =~ ^[0-9a-f]{40}$ && -z "$extra" ]] || return 1
                case "$ref" in
                  "refs/tags/$tag") [[ -z "$object" ]] || return 1; object=$sha ;;
                  "refs/tags/$tag^{}") [[ -z "$peeled" ]] || return 1; peeled=$sha ;;
                  *) return 1 ;;
                esac
              done <<< "$refs"
              [[ -n "$object" && "${peeled:-$object}" == "$expected" ]] || {
                printf 'Release tag %s is not build %s. Bump PROJECT_VERSION for a new source commit.\n' "$tag" "$expected" >&2
                return 1
              }
            else
              status=$?
              if (( status == 2 )) && [[ "$allow_missing" == true ]]; then
                return 0
              fi
              printf 'Cannot verify release tag %s (git status %s); refusing to publish.\n' "$tag" "$status" >&2
              return 1
            fi
          }
          commit=$(git rev-parse HEAD)
          upstream=$(cat UPSTREAM_VERSION)
          [[ "$upstream" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Invalid UPSTREAM_VERSION' >&2; exit 1; }
          for component in "${BASH_REMATCH[@]:1}"; do
            is_uint64 "$component" || { echo 'UPSTREAM_VERSION components must be canonical uint64 values' >&2; exit 1; }
          done
          project=$(cat PROJECT_VERSION)
          [[ "$project" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo 'Invalid PROJECT_VERSION' >&2; exit 1; }
          for component in "${BASH_REMATCH[@]:1}"; do
            is_uint64 "$component" || { echo 'PROJECT_VERSION components must be canonical uint64 values' >&2; exit 1; }
          done
          version="mihomo-optimized-v${project}"
          release_tag="$version"
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            [[ "$EVENT_REF_NAME" == "$release_tag" ]] || { echo 'Tag does not match PROJECT_VERSION' >&2; exit 1; }
          fi
          verify_release_tag "$release_tag" "$commit" true
          {
            printf 'commit=%s\n' "$commit"
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'build_time=%s\n' "$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection and network test tools
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd fakeroot iproute2 nftables
      - name: Select the checked build matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_REF: ${{ inputs.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          matrix_args=()
          if [[ "$EVENT_NAME" == pull_request && -z "$BUILD_REF" ]]; then
            matrix_args=(--profile pr --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA")
          fi
          build_matrix_json=$(python3 scripts/release-build.py matrix "${matrix_args[@]}")
          printf 'matrix=%s\n' "$build_matrix_json" >> "$GITHUB_OUTPUT"
      - name: Verify transparent capture, REDIRECT traffic and TUN blackholes in isolated namespaces
        run: |
          set -euo pipefail
          network_test_binary="$RUNNER_TEMP/transparent-proxy.test"
          trap 'rm -f "$network_test_binary"' EXIT
          CGO_ENABLED=0 go test -tags with_gvisor -c -o "$network_test_binary" ./component/transparentproxy
          sudo -n env MIHOMO_TRANSPARENT_PROXY_INTEGRATION=1 TMPDIR=/tmp \
            "$network_test_binary" -test.run '^(TestNFTKernelRoundTrip|TestNFTRedirKernelTraffic|TestRoutesKernelBlackholeBarrier)$' -test.v -test.timeout 3m
      - name: Verify actual core SIGTERM and systemd stop cleanup
        run: |
          set -euo pipefail
          stop_test_binary="$RUNNER_TEMP/mihomo-stop-test"
          trap 'rm -f "$stop_test_binary"' EXIT
          CGO_ENABLED=0 go build -tags with_gvisor -o "$stop_test_binary" .
          sudo -n python3 scripts/test-transparent-stop.py --core "$stop_test_binary" --require-systemd
      - name: Test fork changes and sync safeguards
        run: bash scripts/ci-check.sh test
      - name: Test configuration permissions with an unprivileged service user
        run: |
          set -euo pipefail
          permission_test_binary="$RUNNER_TEMP/config-file-permissions.test"
          trap 'rm -f "$permission_test_binary"' EXIT
          CGO_ENABLED=0 go test -tags with_gvisor -c -o "$permission_test_binary" ./hub/route
          sudo -n env MIHOMO_CONFIG_FILE_PERMISSION_REQUIRED=1 TMPDIR=/tmp \
            "$permission_test_binary" -test.run '^TestConfigFileUnprivilegedPermissions$' -test.v -test.timeout 2m

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Install package inspection tools
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd fakeroot
      - name: Install pinned Android NDK
        if: matrix.android
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is missing}}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;29.0.14206865'
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$sdk" >> "$GITHUB_ENV"
      - name: Build, package and inspect the complete core with gVisor
        env:
          TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          BUILD_TIME: ${{ needs.check.outputs.build_time }}
        run: bash scripts/ci-check.sh build "$TARGET" "$RUNNER_TEMP/dist" "$BUILD_VERSION" "$BUILD_TIME"
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mihomo-${{ matrix.target }}-${{ needs.check.outputs.commit }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  updater-platforms:
    name: Core updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up upstream-compatible Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Verify native core replacement, rollback and macOS signing
        run: go test -tags with_gvisor -count=1 -timeout=5m ./component/updater ./component/resource ./component/mmdb ./component/geodata ./rules/provider
      - name: Verify native configuration editing and private UI staging
        run: go test -tags with_gvisor -count=1 -timeout=5m ./hub/route -run 'ConfigFile|UIUpdater|UnifiedUpgrade'

  release:
    name: Publish GitHub release
    needs: [check, build, updater-platforms]
    if: >-
      github.repository == 'chummumm/mihomo-optimized' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (startsWith(github.ref, 'refs/tags/') && github.ref_name == needs.check.outputs.release_tag) ||
       (inputs.publish_release && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: dns-release-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - name: Download all release targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mihomo-*-${{ needs.check.outputs.commit }}
          path: dist
          merge-multiple: true
      - name: Publish immutable commit build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.check.outputs.commit }}
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          verify_release_tag() {
            local tag=$1 expected=$2 allow_missing=$3 refs status sha ref extra object= peeled=
            if refs=$(git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"); then
              while IFS=$'\t' read -r sha ref extra; do
                [[ "$sha" =~ ^[0-9a-f]{40}$ && -z "$extra" ]] || return 1
                case "$ref" in
                  "refs/tags/$tag") [[ -z "$object" ]] || return 1; object=$sha ;;
                  "refs/tags/$tag^{}") [[ -z "$peeled" ]] || return 1; peeled=$sha ;;
                  *) return 1 ;;
                esac
              done <<< "$refs"
              [[ -n "$object" && "${peeled:-$object}" == "$expected" ]] || {
                printf 'Release tag %s is not build %s. Bump PROJECT_VERSION for a new source commit.\n' "$tag" "$expected" >&2
                return 1
              }
            else
              status=$?
              if (( status == 2 )) && [[ "$allow_missing" == true ]]; then
                return 0
              fi
              printf 'Cannot verify release tag %s (git status %s); refusing to publish.\n' "$tag" "$status" >&2
              return 1
            fi
          }
          verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" true
          python3 scripts/release-build.py collect dist "$BUILD_VERSION" "$BUILD_SHA"
          cd dist
          sha256sum --check SHA256SUMS
          shopt -s nullglob
          assets=( ./*.gz ./*.zip ./*.deb ./*.rpm ./*.pkg.tar.zst BUILDINFO.json SHA256SUMS version.txt )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" false
            printf 'Release %s already exists; checking its immutable assets.\n' "$RELEASE_TAG"
          else
            {
              printf 'mihomo-optimized `%s`\n\n' "$BUILD_VERSION"
              printf 'Source commit: `%s`\n\n' "$BUILD_SHA"
              printf 'Core 1.0.9 tolerates disappearing per-interface sysctl entries during TUN recreation, including wrapped and joined ENOENT from IPv4/IPv6 forwarding, RA, rp_filter and restoration. Permission, read-only, I/O and required global/default setting failures remain errors; mixed error trees are not discarded. Existing blackholes, interface identity checks and event-driven recovery remain in place. A successful synchronization after a fault now logs the applied TCP/UDP backend availability per address family, distinguishing ready, protected and disabled without repeating on healthy events.\n\n'
              printf 'Core 1.0.8 reduces ordinary pull-request packaging to seven representative targets: Linux amd64/arm64/386, Windows amd64, macOS arm64, FreeBSD amd64 and Android arm64-v8. Toolchain, dependency, platform-specific, build-constraint and packaging/workflow changes retain all 37 targets; uncertain PR diffs also fall back to the full matrix. Existing functional, race, network-namespace, non-root systemd and native updater tests remain required. Main, tag, manual and upstream-sync builds still produce the complete release matrix once, and publication verifies and uploads artifacts from that same run.\n\n'
              printf 'Core 1.0.7 adds TCP REDIRECT through redir-port and protocol-specific local.bypass-ports.udp/tcp (defaults [123]/[]). local.bypass-users now defaults to [mihomo]; explicit [] disables UID bypass. The old bypass-udp-ports remains a parse-only alias, and mixing both keys is rejected. REDIRECT validates real IPv4/IPv6 listeners and guards existing conntrack sessions across port/backend changes and restarts. HTTP/SOCKS/mixed remain explicit proxy protocols.\n\n'
              printf 'Native DEB/RPM/Arch packages now run the service as mihomo, create a non-login system account only when absent, and assign /etc/mihomo recursively plus /usr/bin/mihomo to that user and its existing primary group. Account attributes are preserved when the user already exists. Packages do not start/restart services. Upgrade the native package once, daemon-reload and restart to migrate the service user and resource ownership; core self-update replaces only the executable.\n\n'
              printf 'Repeated positive RA lifetimes, unchanged link/address state and irrelevant main-table ULA routes no longer drive repeated reconciliation. Ordinary events coalesce for 50 ms with a 250 ms bound, while protection/observation failures remain urgent. Native TUN address additions, ULA churn and same-prefix IPv6 privacy rotation refresh caches without resetting every DNS pool; actual interface, IPv4 source and public IPv6 prefix loss still invalidate transports. CI requires real local/gateway IPv4/IPv6 REDIRECT sessions and non-root systemd lifecycle checks.\n\n'
              printf 'Core 1.0.6 adds opt-in Linux transparent-proxy YAML configuration: independent TCP/UDP tproxy, tun or off; configurable exact marks, tables and unique policy priorities; separate local/gateway scopes; real IPv4/IPv6 interface-prefix tracking. Healthy operation is driven by kernel events, with bounded retries only for faults. The managed nftables chains use mangle priority -150.\n\n'
              printf 'Before closing an existing TUN, the core synchronously installs and verifies blackhole route protection. Permanent blackholes and terminal policy guards prevent marked packets falling through to main when the device or lookup rule disappears. Controlled restarts and self-updates retain working blocked capture and blackholes across process replacement, then restore forwarding only after the new backends are ready. No state directory, state file or extra recovery-log objects are created. A committed binary replacement whose restart fails is reported truthfully as installed but not yet restarted.\n\n'
              printf 'Normal SIGTERM and systemd stop remove owned nftables rules, sets, chains, tables and policy routes before closing TUN; cleanup errors retain process-local state for retry. Sysctl restoration uses this process baseline; a cold start after a crash cannot recover a lost earlier value. Transparent routing stays opt-in and replaces native auto-route/auto-redirect and legacy iptables management at runtime without rewriting YAML. Remove former hand-written capture, systemd route commands and prefix cron once. Required Linux CI verifies actual nftables, marked IPv4/IPv6 TUN packets, real core restarts, SIGTERM and systemctl stop in isolated network namespaces. Companion panel remains 0.4.7.\n\n'
              printf 'Core 1.0.5 fixes GeoData automatic scheduling across configuration reloads: enable/disable and interval changes now control the live worker; missing files and initial failures no longer permanently stop future checks. The interval accepts integer hours from 1 through 2562047, preventing time.Duration overflow. Only databases used by the applied configuration participate in startup age checks.\n\n'
              printf 'Companion panel 0.4.7 bounds configuration reload requests to 30 seconds, preserves saved files when the reload result is uncertain, and does not block completion on the follow-up settings refresh. Proxy, provider, rule and core-version state is scoped to the current controller so delayed responses cannot overwrite another controller.\n\n'
              printf 'The independent mihomo-optimized version series started at mihomo-optimized-v1.0.0. Tags, release titles, version.txt and the running core use mihomo-optimized-vX.Y.Z. UPSTREAM_VERSION and UPSTREAM_COMMIT separately record the MetaCubeX base. Existing v1.19.32-optimized-N and earlier binaries require one manual migration because their compiled updater cannot parse the new version format. Published historical releases remain unchanged.\n\n'
              printf 'Core archives use `<full-tag>-<target>.gz` or `<full-tag>-<target>.zip`; Windows archive members use `mihomo-optimized-<target>.exe`. Native installers use fixed names `mihomo-optimized-<target>.deb`, `mihomo-optimized-<target>.rpm` and `mihomo-optimized-<target>.pkg.tar.zst` for stable Latest download links. Their package metadata retains the project version and permanent epoch 1. The mihomo-optimized package replaces mihomo-dns-optimized and mihomo while preserving /usr/bin/mihomo, /etc/mihomo/config.yaml and mihomo.service.\n\n'
              printf '37 platform/CPU targets and 66 binary archives/installers: Linux, Windows, macOS, FreeBSD and Android. Built with MetaCubeX Go 1.26 and with_gvisor. Android uses pinned NDK r29/API34 with CGO; other targets use CGO=0. Linux amd64 is GOAMD64=v1, with separate v2/v3 downloads. Old-Go and LoongArch ABI1 variants are not included. Verify SHA256SUMS before installation.\n\n'
              printf 'Core background updates are controlled only in YAML: core-auto-update and core-update-interval (hours, default false/24). Enabled core and panel policies check once in the background after process startup or restart, then at their configured intervals. Enabling a previously disabled policy also checks immediately; unchanged reloads retain their schedules, while interval changes cancel obsolete work and start the new interval. The core updater compares the actual running project version, selects a strictly newer release from this repository, pins its exact tag and ABI, checks SHA256SUMS, stages safely and restarts through the existing process mechanism after replacement. Final commit rechecks policy, version and executable identity. Self-update does not edit the dpkg/rpm/pacman database; it continues to record the installer version.\n\n'
              printf 'Panel files always come from this repository at clash-dashboard-dist and are installed to ui under the mihomo data directory (follows -d). Custom external-ui path/URL/name no longer change the source or destination. YAML external-ui-auto-update and external-ui-update-interval retain default false/24-hour behavior. An installed panel updates automatically only for a strictly newer build-info.json SemVer. A missing or empty managed ui directory is bootstrapped even when periodic updates are disabled. A panel update replaces static files without restarting the core or clearing DNS state.\n\n'
              printf 'Panel 0.4.6 uses one Check and update action: POST /upgrade/check starts real updates for configured rule providers, GeoData, the fixed dashboard and the core; GET on the same path follows task results. Only the core contacts update sources, and the core upgrades/restarts last. Automatic policies remain in YAML; dashboard path/URL inputs remain removed. DNS filtered totals and direct page cursors now come from one bounded backend response. The YAML editor and draft protection remain available.\n\n'
              printf 'Core mihomo-optimized-v1.0.2 with panel 0.4.4 checks configuration write capability before editing and shows readable files as read-only when they cannot be saved safely. Permission changes during saving preserve the draft with an explicit error. The mobile editor fills the screen and opens at the beginning of the file. CI includes a required Linux permission regression using an unprivileged service UID with root-owned files, plus native configuration editor checks on Windows and macOS. Cross-compilation does not imply testing on every physical platform.\n\n'
              printf 'Core mihomo-optimized-v1.0.3 allows fake-ip and dns-rule-routing together. Existing hosts and FakeIP answers retain priority; questions requiring real resolution continue through DNS rule routing. Synthetic answers do not query upstreams or run IP probes, and retain their own FakeIP TTL and mapping. Domain REJECT rules apply to subsequent business connections when DNS was answered with FakeIP; real routed DNS questions still apply rejection before upstream lookup. The obsolete dedicated DNS port configuration and API handling have been removed. Speed-check none validation is unchanged.\n\n'
              printf 'Panel 0.4.5 uses mihomo as its visible and browser title, shows both core and panel versions, and keeps the sidebar and page content in one viewport shell as browser bars change the usable area. Project package, release and update identities remain mihomo-optimized.\n\n'
              printf 'UDP, TCP and DoT DNS now share reusable transports where the actual outbound is stable. Each connection has one reader, bounded independent pending queries and unpredictable internal DNS IDs never reused during its lifetime. Canceling a query does not close its siblings; late or duplicate replies cannot answer later queries. TCP/DoT serialize complete writes and dispatch out-of-order answers. UDP truncation keeps the same frozen route for TCP fallback. Dynamic or opaque routes retain conservative isolation. Resolver replacement and shutdown close owned transports. DoH/HTTP3/DoQ retain their existing multiplexing.\n\n'
              printf 'Existing DNS rule routing, direct/proxy pool isolation, DIRECT-only speed checks and dual-stack selection, bounded cache prefetch/stale answers, TTL/CNAME protections, redir-host-filter and memory-only observability remain. Ordinary proxy port-53 traffic follows normal routing; only real local-resolver upstream transports are marked DNS-TRANSPORT.\n\n'
              printf 'Required Go/race, release identity, isolated Debian migration, all native package payload/metadata checks and controlled Linux amd64 binary DNS regressions run in CI. Cross-compilation does not imply tests on every physical platform. Packages never start or enable services automatically.\n\n'
              printf 'Installation and migration: https://github.com/%s/blob/%s/docs/releases.md\n' "$GITHUB_REPOSITORY" "$BUILD_SHA"
              printf 'Core/panel configuration: https://github.com/%s/blob/%s/docs/dashboard-management.md\n' "$GITHUB_REPOSITORY" "$BUILD_SHA"
              printf 'Linux transparent routing and migration: https://github.com/%s/blob/%s/docs/transparent-proxy-plan.md\n' "$GITHUB_REPOSITORY" "$BUILD_SHA"
            } > "$RUNNER_TEMP/release-notes.txt"
            verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" true
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$BUILD_SHA" \
              --title "$BUILD_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.txt" \
              --latest=false \
              "${assets[@]}"
          fi
          verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          python3 ../scripts/release-build.py verify-published . "$RUNNER_TEMP/published-release.json"
          verify_release_tag "$RELEASE_TAG" "$BUILD_SHA" false
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BUILD_SHA" == "$current_main" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            printf 'Build %s is not current main (%s); Latest is unchanged.\n' "$BUILD_SHA" "$current_main"
          fi
