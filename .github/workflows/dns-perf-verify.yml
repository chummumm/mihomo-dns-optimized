name: DNS optimization verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dns-optimization-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      SKIP_INTEROP_TEST: '1'
      SKIP_CONCURRENT_TEST: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26'
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: true
      - name: Record immutable source
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/TESTED_SOURCE"
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm cpio zstd
      - name: Existing regressions and race checks
        run: bash scripts/ci-check.sh test
      - name: Optimization race checks
        run: CGO_ENABLED=1 go test -race -tags with_gvisor -count=3 -timeout=5m ./dns/... ./tunnel -run 'TestDNSPerf'
      - name: Controlled optimization benchmarks
        run: CGO_ENABLED=0 go test ./dns ./tunnel -run '^$' -bench 'BenchmarkDNSPerf' -benchmem -count=3
      - name: Actual DNS protocol and 50-source checks
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -tags with_gvisor -o "$RUNNER_TEMP/perf-kernel"
          python3 scripts/test-dns-proxy.py "$RUNNER_TEMP/perf-kernel"
          python3 scripts/test-dns-perf.py "$RUNNER_TEMP/perf-kernel" --expect-shared --per-client 100
      - name: Compare identical controlled load against the previous release
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 5f41e0c384e6b0488e61f6073b65518b9e0300e0
          git worktree add --detach "$RUNNER_TEMP/baseline" FETCH_HEAD
          (cd "$RUNNER_TEMP/baseline"; CGO_ENABLED=0 go build -tags with_gvisor -o "$RUNNER_TEMP/baseline-kernel")
          python3 scripts/test-dns-perf.py "$RUNNER_TEMP/baseline-kernel" --per-client 100
          cp dns/perf_compare_test.go "$RUNNER_TEMP/baseline/dns/"
          (cd "$RUNNER_TEMP/baseline"; CGO_ENABLED=0 go test ./dns -run '^$' -bench BenchmarkDNSPerfCachedAnswer -benchmem -count=3)
      - name: Keep tested source identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dns-optimization-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/TESTED_SOURCE
          retention-days: 7
          if-no-files-found: warn
