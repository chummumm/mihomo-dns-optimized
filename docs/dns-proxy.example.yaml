# 原生 DNS 示例：可进行 -t 配置校验，无远程 provider 或私人节点凭据。
# 所有解析器/代理地址都是文档保留地址，实际使用必须替换为可达服务。
mode: rule
log-level: info
mixed-port: 7890
allow-lan: false

# 默认 false。开启后内置 DNS 先按已有 rules 选实际出站，再选 DNS 池。
# 公共入站的普通 TCP/UDP 53 仍只选出口，保留请求指定的原解析器。
dns-rule-routing: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: redir-host
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false

  # 独立基础解析：用于节点及解析器自身域名，不跟随业务 QNAME 选池。
  default-nameserver:
    - 192.0.2.53

  # 实际 DIRECT/Compatible -> 此池；建议替换为国内可达的普通 DNS。
  # 省略或置空时，DIRECT 保留原 nameserver 行为。
  direct-nameserver:
    - 203.0.113.53
    - 203.0.113.54

  # 实际代理叶子 -> 此池；建议替换为通过该节点可达的海外 DNS / DoH。
  # 原生 UDP/TCP 任意配置端口、DoH/DoT/DoQ/H3 沿同一次选中节点发送。
  nameserver:
    - https://198.51.100.53/dns-query
    - https://198.51.100.54/dns-query

  cache-algorithm: lru
  cache-max-size: 4096

  # 以下为显式启用的可选优化；测速/双栈优选/预取缺省均关闭。
  # 仅 DIRECT/Compatible 的自动上游集合测速；代理与签名回答跳过。
  speed-check-mode: [tcp:443, tcp:80, ping]
  speed-check-timeout: 1000       # 毫秒；0采用1000，最大5000
  speed-check-concurrency: 16    # 0采用16，最大256
  dualstack-ip-selection: true
  dualstack-ip-selection-threshold: 10  # 毫秒；允许0–1000
  dualstack-ip-allow-force-aaaa: false   # 默认保留IPv4
  force-no-cname: true          # 仅压平完整、未受保护的A/AAAA回答链
  rr-ttl-min: 0                 # 不抬高原TTL
  rr-ttl-max: 3600              # 正常回答与缓存的TTL上限，秒
  prefetch-domain: true
  serve-expired: true
  serve-expired-ttl: 604800      # 秒；示例最多使用过期7天的记录，0不限制
  serve-expired-reply-ttl: 1     # 返回过期回答的TTL，允许0

# 仅为完整配置结构提供无凭据的文档节点；实际使用请替换。
proxies:
  - name: 文档代理
    type: socks5
    server: 192.0.2.10
    port: 1080
    udp: true

proxy-groups:
  - name: 示例代理组
    type: select
    proxies:
      - 文档代理
      - DIRECT

# 维护这一份业务规则即可，无需再写 nameserver-policy。
# 规则按原顺序匹配；IN/PROCESS/SRC 规则也可保留在原位置。
rules:
  - DOMAIN-SUFFIX,example.com,DIRECT
  - DOMAIN-SUFFIX,example.net,示例代理组
  - MATCH,DIRECT
