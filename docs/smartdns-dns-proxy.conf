# SmartDNS 接入模板：本地保留 6053 / 6553，使用现有 Mihomo mixed 入口。
# 如果原配置已有 bind / bind-tcp，请合并，而不是重复添加。
bind 127.0.0.1:6053
bind-tcp 127.0.0.1:6053
bind 127.0.0.1:6553
bind-tcp 127.0.0.1:6553

# Mihomo: mixed-port: 7890、mode: rule、dns-rule-routing: true。
# 本地服务端口不是自动分流目标；SmartDNS 送往上游的目标端口应为 53。
proxy-server socks5://127.0.0.1:7890 -name mihomo-dns

# 以下是文档保留地址，不能作为实际 DNS 使用，必须替换为自己的可达解析器。
# 普通 TCP DNS 适合所选代理节点不支持 UDP 的情况。
server-tcp 192.0.2.53:53 -proxy mihomo-dns
server-tcp 198.51.100.53:53 -proxy mihomo-dns

# 所有可能选中的出口均支持 UDP 时，也可以使用普通 UDP DNS：
# server 192.0.2.53:53 -proxy mihomo-dns
# server 198.51.100.53:53 -proxy mihomo-dns

# HTTP CONNECT 可承载普通 TCP DNS；使用时替换上面的 SOCKS5 proxy-server 行：
# proxy-server http://127.0.0.1:7890 -name mihomo-dns

# 此模板不配置 DoH / DoT / DoQ；这些协议不能在普通入站按每个 QNAME 分类。
# SmartDNS 的缓存与本地规则仍由 SmartDNS 自己管理。
